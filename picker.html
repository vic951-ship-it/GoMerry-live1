<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoMerry $1</title>
<script src="https://www.paypal.com/sdk/js?client-id=PAYPAL_CLIENT_ID_PLACEHOLDER&currency=USD"></script>
<style>body{font-family:Arial;background:#f0f8ff;padding:15px}.card{background:white;padding:20px;border-radius:15px;max-width:420px;margin:auto;box-shadow:0 5px 20px rgba(0,0,0,0.1)}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}button{width:100%;padding:14px;background:#0070ba;color:white;border:none;border-radius:8px;font-size:17px;font-weight:bold}.hidden{display:none}</style>
</head><body>
<div class="card" id="s1">
<h2>GoMerry - Pay $1 to Play</h2>
<input id="regName" placeholder="Your Name">
<input id="regPhone" placeholder="Phone / Email">
<div id="paypal-button"></div>
<p id="regStatus" style="color:green"></p>
</div>
<div class="card hidden" id="s2">
<h2>Choose Amount</h2>
<select id="rangeSel" onchange="updR()"><option value="1-10">$1-10 Win $100</option><option value="10-50">$10-50 Win $500</option><option value="50-100">$50-100 Win $1000</option><option value="1-100">$1-100 Win $1000</option></select>
<p>Your Pay: $<span id="aT">5</span> → Win $<span id="wT">50</span></p>
<input type="range" id="rng" min="1" max="10" value="5" oninput="updA()">
<input id="name" placeholder="Name"><input id="phone" readonly>
<button onclick="join()">JOIN & WIN 10X</button>
<div id="res"></div><p id="gInfo"></p>
</div>
<script>
let rmin=1,rmax=10,amt=5;
function updR(){let v=document.getElementById('rangeSel').value;[rmin,rmax]=v.split('-').map(Number);let r=document.getElementById('rng');r.min=rmin;r.max=rmax;r.value=Math.floor((rmin+rmax)/2);updA();load();}
function updA(){amt=document.getElementById('rng').value;document.getElementById('aT').innerText=amt;document.getElementById('wT').innerText=amt*10;}
paypal.Buttons({createOrder:(d,a)=>{if(!regName.value||!regPhone.value){alert('Enter name & phone');return;}return a.order.create({purchase_units:[{amount:{value:'1.00'}}]})},onApprove:(d,a)=>a.order.capture().then(()=>{fetch('/api/verify_registration',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:regPhone.value,name:regName.value,orderID:d.orderID})}).then(()=>{regStatus.innerText='✅ $1 Paid!';s1.classList.add('hidden');s2.classList.remove('hidden');name.value=regName.value;phone.value=regPhone.value;updR();})})}).render('#paypal-button');
function join(){fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,phone:phone.value,range_min:rmin,range_max:rmax,amount:parseInt(amt)})}).then(r=>r.json()).then(d=>{if(d.error){alert(d.error);return;}res.innerHTML=`<div style="background:#e8ffe8;padding:15px;border-radius:10px"><h3>Group #${d.group_number}</h3><p>You: $${amt} | Win: $${d.lifetime_amount}<br>${d.count}/10 | Pool $${d.total}<br>${d.is_full?'Winner: '+d.beneficiary.name:''}</p></div>`;load();})}
function load(){fetch(`/api/group_status/${rmin}/${rmax}`).then(r=>r.json()).then(d=>{gInfo.innerText=`Group: ${d.count||0}/10 | $${d.total||0}`;});}
</script></body></html>
